name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q app
      - run: python -m pytest -q

  coverage:
    name: Backend coverage (85% minimum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-report=json --cov-fail-under=85
      - name: Publish coverage summary
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          with open("coverage.json", encoding="utf-8") as report:
              total = json.load(report)["totals"]["percent_covered"]
          print(f"COVERAGE_PERCENT={total:.2f}")
          PY
          {
            echo "## Backend coverage"
            echo ""
            echo "**${COVERAGE_PERCENT}%** branch-aware coverage"
            echo ""
            echo "Required minimum: **85%**"
            echo ""
            echo "Download the **python-coverage** artifact from this workflow run for detailed XML and JSON reports."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: |
            coverage.xml
            coverage.json
          if-no-files-found: error

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build
