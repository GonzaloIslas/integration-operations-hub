services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: integration_hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d integration_hub"]
      interval: 5s
      timeout: 3s
      retries: 10
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
    environment:
      APPLICATION_ENVIRONMENT: container
      DATABASE_URL: postgresql+psycopg://hub:hub@db:5432/integration_hub
      FRONTEND_ORIGIN: http://localhost:8080
      OPERATOR_USERNAME: operator
      OPERATOR_PASSWORD: local-development-only
      INTEGRATION_API_KEY: local-integration-api-key
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-astra}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  worker:
    build:
      context: .
    command: ["python", "-m", "app.worker"]
    environment:
      APPLICATION_ENVIRONMENT: container
      DATABASE_URL: postgresql+psycopg://hub:hub@db:5432/integration_hub
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      RETRY_MAX_ATTEMPTS: 3
      RETRY_INITIAL_BACKOFF_SECONDS: 5
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
